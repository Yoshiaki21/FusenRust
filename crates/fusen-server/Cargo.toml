[package]
name = "fusen-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "FusenRust の同期サーバー（axum + SQLite + ファイル保存）"

[dependencies]
fusen-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"

[dev-dependencies]
fusen-core.workspace = true
tempfile.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio-tungstenite = "0.30"
