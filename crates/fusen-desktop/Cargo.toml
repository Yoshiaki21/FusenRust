[package]
name = "fusen-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Markdown の色分け（編集時）のために tree-sitter の Markdown 文法を有効にする
gpui-kit = { workspace = true, features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jxl-oxide = { version = "0.12.6", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
async-channel = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
# KDE のトレイ（StatusNotifierItem）。D-Bus だけで動き、GTK のイベントループを必要としないため採用
ksni = { version = "0.3.7", features = ["blocking"] }
