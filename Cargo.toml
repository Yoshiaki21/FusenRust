[workspace]
resolver = "3"
members = ["crates/fusen-desktop"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# gpui-kit（gpui + gpui-base + gpui-component + アイコン）は git の特定コミットに固定する。
# gpui 本体は gpui-kit が `gpui-pre =0.3.12`（crates.io のスナップショット）で厳密に固定しているので、
# gpui-kit の rev を固定すれば gpui のバージョンも自動的に一致する（docs/decisions.md 参照）。
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "48e53b11762a7ac37835acca889a924c569ff681" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
